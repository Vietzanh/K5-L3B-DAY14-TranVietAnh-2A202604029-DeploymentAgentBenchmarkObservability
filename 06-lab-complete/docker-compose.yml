# ============================================================
# Agent + Redis bằng một lệnh (tiêu chí 2):
#   cp .env.example .env        # rồi sửa AGENT_API_KEY
#   docker compose up --build
# ============================================================
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false          # không có .env vẫn chạy được
    environment:
      REDIS_URL: redis://redis:6379/0   # ghi đè REDIS_URL trong .env: trong compose, Redis là service "redis"
      PORT: "8000"
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 15s       # thời gian cho graceful shutdown trước khi SIGKILL
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
