# ============================================================
# Railway deploy config (tiêu chí 12)
#   Deploy: cd 06-lab-complete && railway up
#   Biến cần đặt trên Railway (Variables), KHÔNG ghi vào đây:
#     AGENT_API_KEY, REDIS_URL (trỏ tới Redis service của project), ENVIRONMENT=production
#   PORT do Railway cấp; CMD trong Dockerfile đã đọc ${PORT}.
# ============================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
